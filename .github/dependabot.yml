# Weekly dependency updates. Minor and patch releases arrive grouped (one PR
# for the runtime, one for the tooling); a major release gets its own PR so it
# can be read against the upgrade notes. CI runs on every one of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The Node types must match the runtime (.nvmrc, engines.node): bump them with Node, not before.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A TypeScript major waits until eslint-config-next (typescript-eslint) supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The code guide (guide/, its own Astro project): one grouped PR for minor and patch releases.
  - package-ecosystem: npm
    directory: /guide
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      guide:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(guide)"

  # The pinned action commits in .github/workflows/*.yml (the version comment is updated too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
