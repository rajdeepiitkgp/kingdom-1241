# Deletes old Vercel deployments (scripts/prune-deployments.ts) so Deployment
# Storage stays far below the Hobby plan's 10 GB: one build is about 150 MB and
# Vercel itself keeps every deployment for 30 days. Kept: the live deployment,
# the one before it, the newest preview of each open pull request and anything
# still building.
#
# Runs when Vercel reports a finished deployment (its commit status), once a day
# as a backstop, and by hand (Actions → Prune deployments → Run workflow; a dry
# run unless you untick it). Secret: VERCEL_TOKEN (SETUP.md § 5); without it the
# run only leaves a warning.
#
# Actions are pinned to a commit (the version is the comment); Dependabot
# (.github/dependabot.yml) opens a PR when a new release is out.
name: Prune deployments

on:
  status:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

# One at a time; a deployment that finishes during a run gets the next one.
concurrency:
  group: prune-deployments
  cancel-in-progress: false

jobs:
  prune:
    # Every commit status triggers the workflow; only Vercel's "deployment ready" does anything.
    if: github.event_name != 'status' || (github.event.context == 'Vercel' && github.event.state == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No secret in this step: `npm ci` runs the install scripts of every dependency.
      - name: Install
        run: npm ci

      - name: Prune deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npm run deployments:prune -- $DRY_RUN
