# Checks every pull request and every push to main.
# Vercel deploys independently (see SETUP.md § 6); protect `main` so a PR can
# only be merged — and therefore deployed — when this workflow is green.
#
# Actions are pinned to a commit (the version is the comment); Dependabot
# (.github/dependabot.yml) opens a PR when a new release is out.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Builds without Supabase or translation keys: the site falls back to the
      # bundled seed content, which is exactly what we want to verify compiles.
      - name: Build
        run: npm run build

      # The browser suite (docs/QA.md) serves the build above, still without
      # keys: seed content and in-memory Rally Sync rooms. The laptop and the
      # Android phone run here; the iPhone runs on macOS (job below).
      - name: Install browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser tests
        run: npm run e2e -- --project=desktop-chromium --project=phone-chromium

      # The JUnit results of both suites as tables on the run's summary page and
      # notes on the failing tests. Annotate-only needs no write access, so
      # Dependabot's runs report too.
      - name: Unit test report
        if: ${{ !cancelled() && hashFiles('reports/junit/unit.xml') != '' }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: reports/junit/unit.xml
          check_name: Unit tests
          annotate_only: true

      - name: Browser test report
        if: ${{ !cancelled() && hashFiles('reports/junit/e2e.xml') != '' }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: reports/junit/e2e.xml
          check_name: Browser tests (laptop and Android)
          annotate_only: true
          detailed_summary: true
          include_passed: true
          group_suite: true
          flaky_summary: true

      # JUnit XML, Playwright's HTML report, and a failed test's screenshot and
      # trace. Seed content only, so fine on a public repository.
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The iPhone device of the browser suite, on macOS: Apple's WebKit is what
  # iPhones run, while WebKit's Linux build differs (it refuses the site's
  # Secure cookies on http://localhost and has older locale data).
  iphone:
    name: Browser tests (iPhone)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install webkit

      - name: Browser tests
        run: npm run e2e -- --project=phone-webkit

      - name: Browser test report
        if: ${{ !cancelled() && hashFiles('reports/junit/e2e.xml') != '' }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: reports/junit/e2e.xml
          check_name: Browser tests (iPhone)
          annotate_only: true
          detailed_summary: true
          include_passed: true
          group_suite: true
          flaky_summary: true

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-iphone
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
