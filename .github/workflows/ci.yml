# Checks every pull request and every push to main.
# Vercel deploys independently (see SETUP.md § 6); protect `main` so a PR can
# only be merged — and therefore deployed — when this workflow is green.
#
# Actions are pinned to a commit (the version is the comment); Dependabot
# (.github/dependabot.yml) opens a PR when a new release is out.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Builds without Supabase or translation keys: the site falls back to the
      # bundled seed content, which is exactly what we want to verify compiles.
      - name: Build
        run: npm run build
