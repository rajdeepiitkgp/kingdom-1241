# Tasks you would otherwise run from a laptop with .env.local, the weekly
# content backup and the daily feedback prune. Actions → Maintenance → Run
# workflow → pick a task; the schedules below run `backup` and `prune` on their own.
#
# Secrets (SETUP.md § 6): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY,
# ANTHROPIC_API_KEY (or GEMINI_API_KEY), SITE_URL, TRANSLATE_WEBHOOK_SECRET,
# BACKUP_PASSPHRASE, KVK_SEED_PASSWORD (optional). `webhooks` and `config-push`
# use the Supabase CLI with the Deploy database secrets (SUPABASE_ACCESS_TOKEN,
# SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD). Variables (optional):
# TRANSLATION_PROVIDER, ANTHROPIC_MODEL, GEMINI_MODEL.
#
# Actions are pinned to a commit (the version is the comment); Dependabot
# (.github/dependabot.yml) opens a PR when a new release is out.
name: Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        required: true
        default: seed
        options:
          - seed
          - sync-ui
          - translate
          - translate-dry-run
          - revalidate
          - backup
          - prune
          - prune-dry-run
          - webhooks
          - config-push
  schedule:
    # Weekly content backup, Monday 04:17 UTC. GitHub stops the schedules of a
    # public repository after 60 days without a commit (SETUP.md § 10).
    - cron: "17 4 * * 1"
    # Daily prune of battle feedback past its retention period (SETUP.md § 9).
    - cron: "41 5 * * *"

permissions:
  contents: read

env:
  # A scheduled run has no input: the daily schedule is the prune, the Monday one the backup.
  TASK: ${{ inputs.task || (github.event.schedule == '41 5 * * *' && 'prune' || 'backup') }}
  # Pinned like deploy-database.yml; bump both together.
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  run:
    name: ${{ inputs.task || (github.event.schedule == '41 5 * * *' && 'prune' || 'backup') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      TRANSLATE_WEBHOOK_SECRET: ${{ secrets.TRANSLATE_WEBHOOK_SECRET }}
      KVK_SEED_PASSWORD: ${{ secrets.KVK_SEED_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Node tasks (the scripts in scripts/) ---------------------------------

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.TASK != 'revalidate' && env.TASK != 'webhooks' && env.TASK != 'config-push'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: env.TASK != 'revalidate' && env.TASK != 'webhooks' && env.TASK != 'config-push'
        run: npm ci

      - name: Seed database
        if: env.TASK == 'seed'
        run: npm run db:seed

      - name: Sync interface strings
        if: env.TASK == 'sync-ui'
        run: npm run db:seed -- --sync-ui

      - name: Translate content
        if: env.TASK == 'translate'
        run: npm run translate

      - name: Translate (dry run)
        if: env.TASK == 'translate-dry-run'
        run: npm run translate -- --dry-run

      # Battle feedback past its retention period (kvk_retrospectives.retention_days
      # after the battle) is deleted and the form closed; one audit_log entry per battle.
      - name: Prune expired feedback
        if: env.TASK == 'prune'
        run: npm run prune

      - name: Prune expired feedback (dry run)
        if: env.TASK == 'prune-dry-run'
        run: npm run prune -- --dry-run

      # The file is encrypted with BACKUP_PASSPHRASE before it leaves the runner:
      # this is a public repository and anyone with a GitHub account can download
      # an artifact. Restore: SETUP.md § 10.
      - name: Back up content
        if: env.TASK == 'backup'
        run: npm run backup

      - name: Keep the backup for 90 days
        if: env.TASK == 'backup'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kingdom-1241-backup-${{ github.run_number }}
          path: backups/*.json.enc
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      # --- Plain HTTP ---------------------------------------------------------

      - name: Refresh site cache
        if: env.TASK == 'revalidate'
        run: |
          curl --fail --silent --show-error -X POST "$SITE_URL/api/revalidate" \
            -H "Authorization: Bearer $TRANSLATE_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" -d '{}'

      # --- Supabase CLI tasks ---------------------------------------------------

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: env.TASK == 'webhooks' || env.TASK == 'config-push'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link project
        if: env.TASK == 'webhooks' || env.TASK == 'config-push'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Runs supabase/webhooks.sql with the real site URL and secret filled in
      # (one trigger per content table → POST /api/translate). Re-run it after a
      # new content table or a secret change; it replaces the triggers in place.
      - name: Install translation webhooks
        if: env.TASK == 'webhooks'
        run: |
          test -n "$SITE_URL" || { echo "SITE_URL secret is missing"; exit 1; }
          test -n "$TRANSLATE_WEBHOOK_SECRET" || { echo "TRANSLATE_WEBHOOK_SECRET secret is missing"; exit 1; }
          sed -e "s|https://YOUR-SITE.vercel.app|${SITE_URL%/}|" \
              -e "s|YOUR_TRANSLATE_WEBHOOK_SECRET|$TRANSLATE_WEBHOOK_SECRET|" \
              supabase/webhooks.sql > "$RUNNER_TEMP/webhooks.sql"
          supabase db query --linked -f "$RUNNER_TEMP/webhooks.sql"
          rm -f "$RUNNER_TEMP/webhooks.sql"
          echo "Translation webhooks installed for ${SITE_URL%/}/api/translate"

      # Applies the [auth] settings declared in supabase/config.toml (site URL,
      # allowed redirect URLs, e-mail sign-ups off). Undeclared properties, such
      # as the Discord provider, stay as they are in the dashboard.
      - name: Push Supabase config
        if: env.TASK == 'config-push'
        run: supabase config push --yes
