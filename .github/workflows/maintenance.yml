# One-off tasks you would otherwise run from a laptop with .env.local:
# seed the database, run the Gemini translation pass, or refresh the site cache.
# Actions → Maintenance → Run workflow → pick a task.
#
# Secrets used (SETUP.md § 6): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SECRET_KEY,
# GEMINI_API_KEY, SITE_URL, TRANSLATE_WEBHOOK_SECRET, KVK_SEED_PASSWORD (optional).
name: Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        required: true
        default: seed
        options:
          - seed
          - sync-ui
          - translate
          - translate-dry-run
          - revalidate

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
      TRANSLATE_WEBHOOK_SECRET: ${{ secrets.TRANSLATE_WEBHOOK_SECRET }}
      KVK_SEED_PASSWORD: ${{ secrets.KVK_SEED_PASSWORD }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: inputs.task != 'revalidate'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: inputs.task != 'revalidate'
        run: npm ci

      - name: Seed database
        if: inputs.task == 'seed'
        run: npm run db:seed

      - name: Sync interface strings
        if: inputs.task == 'sync-ui'
        run: npm run db:seed -- --sync-ui

      - name: Translate content
        if: inputs.task == 'translate'
        run: npm run translate

      - name: Translate (dry run)
        if: inputs.task == 'translate-dry-run'
        run: npm run translate -- --dry-run

      - name: Refresh site cache
        if: inputs.task == 'revalidate'
        run: |
          curl --fail --silent --show-error -X POST "$SITE_URL/api/revalidate" \
            -H "Authorization: Bearer $TRANSLATE_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" -d '{}'
